                    const ctx = ensureAudioContext();
                    if (ctx && ctx.resume && ctx.state === 'suspended') {
                        ctx.resume().catch(e => console.warn('恢复音频上下文失败:', e));
                    }
                    
                    // 立即检查音频状态
                    if (checkAudioStatus()) {
                        audioRestored = true;
                        showNotification('音频已恢复', 'success');
                        clearInterval(audioCheckTimer);
                        return;
                    }
                    
                    // 尝试1: 快速音量重置（立即执行，不延迟）
                    video.volume = 0;
                    video.volume = 1;
                    
                    // 尝试1.5: 确保音频轨道被启用
                    if (video.audioTracks && video.audioTracks.length > 0) {
                        console.log(`音频恢复尝试 ${audioCheckCount}: 强制启用所有音频轨道`);
                        for (let i = 0; i < video.audioTracks.length; i++) {
                            video.audioTracks[i].enabled = true;
                        }
                    }
                    
                    // 尝试2: 刷新媒体元素属性
                    video.muted = false; // 确保未静音
                    video.crossOrigin = 'anonymous'; // 确保跨域设置正确
                    
                    // 尝试3: 暂停再播放（提前到第1次尝试）
                    if (audioCheckCount >= 1) {
                        video.pause();
                        setTimeout(() => {
                            video.play().catch(e => console.warn('恢复播放失败:', e));
                        }, 200); // 减少延迟时间
                    }
                    
                    // 尝试4: 使用Web Audio API创建静音振荡器（提高成功率）
                    if (audioCheckCount >= 2 && ctx) {
                        try {
                            console.log(`音频恢复尝试 ${audioCheckCount}: 使用Web Audio API创建音频上下文`);
                            const oscillator = ctx.createOscillator();
                            const gainNode = ctx.createGain();
                            
                            // 创建静音信号，只用于激活音频通道
                            gainNode.gain.value = 0;
                            
                            oscillator.connect(gainNode);
                            gainNode.connect(ctx.destination);
                            
                            oscillator.start();
                            oscillator.stop(ctx.currentTime + 0.1); // 播放极短时间的静音
                        } catch (e) {
                            console.warn('创建音频振荡器失败:', e);
                        }
                    }
                    
                    // 尝试5: 刷新播放源（第3次尝试）
                    if (audioCheckCount >= 3 && !isUsingNativePlayback && hls) {
                        console.log(`音频恢复尝试 ${audioCheckCount}: 尝试刷新播放源`);
                        try {
                            // 不重新加载整个页面，而是刷新当前媒体源
                            const currentTime = video.currentTime;
                            video.pause();
                            video.currentTime = Math.max(0, currentTime - 1); // 略微回退
                            
                            setTimeout(() => {
                                // 重新播放但保持在相同位置
                                video.play().catch(error => {
                                    console.warn('刷新播放源失败:', error);
                                });
                            }, 150);
                        } catch (error) {
                            console.error('刷新播放源失败:', error);
                        }
                    }
                    
                    // 尝试6: 强制重新加载媒体元数据
                    if (audioCheckCount >= 4) {
                        console.log(`音频恢复尝试 ${audioCheckCount}: 强制重新加载媒体元数据`);
                        video.load();
                        setTimeout(() => {
                            video.play().catch(e => console.warn('重新加载后播放失败:', e));
                        }, 300);
                    }
                    
                    // 尝试7: 降级到原生播放（最后尝试）
                    if (audioCheckCount === maxAudioChecks) {
                        console.log('尝试降级到原生HLS播放以恢复音频...');
                        showNotification('尝试恢复音频，切换到原生播放模式...', 'info');
                        try {
                            if (hls) {
                                hls.destroy();
                                isUsingNativePlayback = true; // 设置原生播放标志
                            }
                            // 修复原生播放错误：使用blob URL方式处理MIME类型问题
                            const originalUrl = playUrl;
                            // 先尝试直接设置src（适用于大多数情况）
                            video.src = originalUrl;
                            video.load();
                            setTimeout(() => {
                                video.play().catch(() => {
                                    console.warn('原生播放初始尝试失败，尝试替代方案');
                                    // 如果失败，尝试通过fetch获取内容后使用blob URL
                                    fetch(originalUrl)
                                        .then(response => response.blob())
                                        .then(blob => {
                                            const blobUrl = URL.createObjectURL(blob);
                                            video.src = blobUrl;
                                            video.load();
                                            video.play().catch(e => console.error('原生播放替代方案失败:', e));
                                        })
                                        .catch(e => console.error('获取流内容失败:', e));
                                });
                            }, 500); // 减少延迟
                        } catch (e) {
                            console.error('降级到原生播放失败:', e);
                        }
                    }
                }
                
                // 提前初始化音频 - 在视频元素准备好时就开始
                video.addEventListener('loadedmetadata', () => {
                    console.log('视频元数据加载完成，开始音频初始化');
                    // 立即创建音频上下文
                    ensureAudioContext();
                    
                    // 强制启用音频轨道
                    if (video.audioTracks && video.audioTracks.length > 0) {
                        console.log('强制启用音频轨道:', video.audioTracks.length);
                        for (let i = 0; i < video.audioTracks.length; i++) {
                            video.audioTracks[i].enabled = true;
                        }
                    }
                    
                    // 预先检查音频状态
                    checkAudioStatus();
                });
                
                // 视频播放时开始音频检测
                video.addEventListener('playing', () => {
                    // 清除任何可能存在的旧定时器
                    clearInterval(audioCheckTimer);
                    
                    // 立即强制启用音频轨道
                    if (video.audioTracks && video.audioTracks.length > 0) {
                        console.log('播放开始时强制启用音频轨道:', video.audioTracks.length);
                        for (let i = 0; i < video.audioTracks.length; i++) {
                            video.audioTracks[i].enabled = true;
                        }
                    }
                    
                    // 初次检查音频状态
                    if (!checkAudioStatus()) {
                        // 没有检测到音频，设置定时检查和恢复
                        audioCheckTimer = setInterval(() => {
                            // 立即执行尝试恢复（不再等待额外的间隔）
                            attemptAudioRecovery();
                        }, 1500); // 进一步减少检查间隔
                    } else {
                        // 音频正常
                        audioRestored = true;
                    }
                });
                
                // 视频结束或播放停止时清理定时器
                video.addEventListener('ended', () => {
                    clearInterval(audioCheckTimer);
                });
                
                video.addEventListener('pause', () => {
                    clearInterval(audioCheckTimer);
                });
                
                hls.loadSource(playUrl);
                hls.attachMedia(video);
                
                // 确保频道切换时重置原生播放状态
                isUsingNativePlayback = false;
                
                // 添加恢复机制
                            video.addEventListener('error', () => {
                                console.error('视频元素错误:', video.error);
                                // 尝试重新加载
                                if (errorCount < currentConfig.maxRetries) {
                                    errorCount++;
                                    showNotification(`播放错误，尝试重新加载(${errorCount}/${currentConfig.maxRetries})...`, 'warning');
                                    setTimeout(() => {
                                        // 确保安全地销毁和重新初始化
                                        try {
                                            if (hls) {
                                                hls.destroy();
                                                hls = null;
                                            }
                                            // 完全重置视频元素
                                            video.pause();
                                            video.src = '';
                                            video.load();
                                            // 重新初始化播放器
                                            initializePlayer();
                                        } catch (e) {
                                            console.error('重新初始化播放器失败:', e);
                                        }
                                    }, currentConfig.retryDelay * errorCount);
                                }
                            });
            } else if (video.canPlayType('application/vnd.apple.mpegurl') || true) { // 强制使用修复的原生播放逻辑
                // 修复的原生HLS播放支持
                console.log('使用修复的原生HLS播放支持');
                isUsingNativePlayback = true; // 设置原生播放标志
                
                // 尝试直接设置src（适用于大多数情况）
                video.src = playUrl;
                
                // 添加错误处理
                const handleLoadError = () => {
                    console.warn('直接加载失败，尝试使用blob URL方式');
                    // 移除事件监听器以避免重复调用
                    video.removeEventListener('error', handleLoadError);
                    
                    // 通过fetch获取内容后使用blob URL
                    fetch(playUrl)
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('网络响应错误');
                            }
                            return response.blob();
                        })
                        .then(blob => {
                            const blobUrl = URL.createObjectURL(blob);
                            console.log('使用blob URL播放:', blobUrl);
                            video.src = blobUrl;
                            video.load();
                            setupPlayback();
                        })
                        .catch(e => {
                            console.error('获取流内容失败:', e);
                            showNotification('无法加载视频流，请检查网络连接', 'error');
                        });
                };
                
                // 原生播放的音频初始化函数
                function initializeNativeAudioChannel() {
                    console.log('初始化原生播放的音频通道...');
                    // 确保音频上下文已创建
                    ensureAudioContext();
                    
                    // 确保音频轨道启用
                    if (video.audioTracks && video.audioTracks.length > 0) {
                        for (let i = 0; i < video.audioTracks.length; i++) {
                            video.audioTracks[i].enabled = true;
                        }
                    }
                    
                    // 立即尝试恢复音频上下文
                    if (audioContext && audioContext.resume && audioContext.state === 'suspended') {
                        audioContext.resume().catch(e => console.warn('无法恢复音频上下文:', e));
                    }
                }
                
                // 设置播放
                const setupPlayback = () => {
                    // 预先初始化音频通道
                    initializeNativeAudioChannel();
                    
                    if (document.getElementById('autoPlay').checked) {
                        setTimeout(() => {
                            video.play().catch(error => {
                                console.warn('原生播放自动播放失败:', error);
                                
                                // 特殊处理AbortError和被中止的错误
                                if (error.name === 'AbortError' || error.message.includes('aborted by the user agent')) {
                                    console.error('原生播放媒体资源获取被中止:', error);
                                    showNotification('媒体加载被中止，正在尝试恢复...', 'warning');
                                    
                                    // 尝试恢复策略
                                    setTimeout(() => {
                                        try {
                                            video.pause();
                                            video.src = '';
                                            video.load();
                                            video.src = playUrl;
                                            video.load();
                                            setTimeout(() => {
                                                video.play().catch(err => {
                                                    console.warn('恢复播放再次失败:', err);
                                                    showNotification('请点击播放按钮手动开始播放', 'info');
                                                });
                                            }, 300);
                                        } catch (recoverError) {
                                            console.error('原生播放恢复失败:', recoverError);
                                            showNotification('请点击播放按钮手动开始播放', 'info');
                                        }
                                    }, 500);
                                } else {
                                    showNotification('自动播放失败，点击播放按钮或视频区域开始播放', 'info');
                                }
                            });
                        }, 200); // 稍微延迟以确保元素完全准备好
                    } else {
                        // 设置播放按钮初始状态为播放图标
                        const playPauseBtn = document.getElementById('playPauseBtn');
                        if (playPauseBtn) {
                            playPauseBtn.innerHTML = '▶️';
                        }
                    }
                };
                
                // 添加错误监听器
                video.addEventListener('error', handleLoadError);
                
                // 添加元数据加载成功监听器
                video.addEventListener('loadedmetadata', () => {
                    // 移除错误监听器，因为加载成功
                    video.removeEventListener('error', handleLoadError);
                    setupPlayback();
                });
                
                // 确保加载
                video.load();
            } else {
                showNotification('您的浏览器不支持HLS播放', 'error');
            }
        }

        // 处理视频错误
        function handleVideoError() {
            console.error('视频播放错误:', video.error);
            showNotification('视频播放错误，请尝试其他频道', 'error');
        }

        // 显示加载状态
        function showLoading(show) {
            if (show) {
                elements.channelList.innerHTML = `
                    <div class="loading">
                        <div class="loader"></div>
                        <span>加载中...</span>
                    </div>
                `;
                elements.loadPlaylistBtn.disabled = true;
                elements.loadPlaylistBtn.innerHTML = '<div class="loader" style="width: 16px; height: 16px; margin-right: 8px;"></div> 加载中...';
            } else {
                elements.loadPlaylistBtn.disabled = false;
                elements.loadPlaylistBtn.textContent = '加载订阅';
            }
        }

        // 显示通知
        function showNotification(message, type = 'info') {
            const notification = elements.notification;
            notification.textContent = message;
            notification.className = 'notification';
            
            if (type === 'error') {
                notification.classList.add('error');
            } else if (type === 'success') {
                notification.classList.add('success');
            } else {
                notification.classList.add('info');
            }
            
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 显示模态框
        function showModal(title, body, confirmCallback = null) {
            elements.modalTitle.textContent = title;
            elements.modalBody.innerHTML = body;
            elements.modal.classList.add('show');
            
            // 存储确认回调
            elements.modalConfirm.onclick = () => {
                if (confirmCallback) {
                    confirmCallback();
                }
                closeModal();
            };
        }

        // 关闭模态框
        function closeModal() {
            elements.modal.classList.remove('show');
        }

        // 添加订阅到列表
        function addPlaylistToList(name, url) {
            // 检查是否已存在
            const existingIndex = storedPlaylists.findIndex(p => p.url === url);
            
            if (existingIndex === -1) {
                storedPlaylists.push({ name, url });
                saveStoredPlaylists();
                renderPlaylistList();
            }
        }

        // 添加新订阅
        function addNewPlaylist() {
            const name = elements.newPlaylistName.value.trim();
            const url = elements.newPlaylistUrl.value.trim();
            
            if (!name || !url) {
                showNotification('请填写订阅名称和地址', 'error');
                return;
            }
            
            addPlaylistToList(name, url);
            
            elements.newPlaylistName.value = '';
            elements.newPlaylistUrl.value = '';
            
            showNotification('订阅添加成功', 'success');
        }

        // 渲染订阅列表
        function renderPlaylistList() {
            elements.playlistList.innerHTML = '';
            
            if (storedPlaylists.length === 0) {
                elements.playlistList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📋</div>
                        <div class="empty-title">暂无订阅源</div>
                        <p>添加一个M3U订阅源开始使用</p>
                    </div>
                `;
                return;
            }
            
            storedPlaylists.forEach((playlist, index) => {
                const card = document.createElement('div');
                card.className = 'playlist-card scale-in';
                card.innerHTML = `
                    <div class="playlist-info">
                        <div class="playlist-name">${playlist.name}</div>
                        <div class="playlist-url">${playlist.url}</div>
                    </div>
                    <div class="playlist-actions">
                        <button class="btn btn-primary btn-icon" data-index="${index}" title="播放">▶</button>
                        <button class="btn btn-secondary btn-icon" data-index="${index}" title="编辑">✎</button>
                        <button class="btn btn-danger btn-icon" data-index="${index}" title="删除">✕</button>
                    </div>
                `;
                
                elements.playlistList.appendChild(card);
                
                // 添加按钮事件
                card.querySelector('.btn-primary').addEventListener('click', (e) => {
                    const idx = parseInt(e.currentTarget.getAttribute('data-index'));
                    const pl = storedPlaylists[idx];
                    elements.playlistUrl.value = pl.url;
                    elements.playlistName.value = pl.name;
                    switchSection('home');
                    
                    setTimeout(() => {
                        // 检查是否为单频道播放列表
                        if (pl.isSingleChannel && pl.channels && pl.channels.length > 0) {
                            // 直接使用保存的频道数据，避免尝试解析单个频道URL
                            currentPlaylist = {
                                name: pl.name,
                                url: pl.url,
                                channels: pl.channels
                            };
                            allChannels = pl.channels;
                            
                            // 渲染频道列表
                            renderChannelList();
                            renderGroupTags();
                            
                            showNotification(`成功加载单频道: ${pl.name}`, 'success');
                            
                            // 自动选择并播放频道
                            selectChannel(pl.channels[0]);
                            playChannel(pl.channels[0]);
                        } else {
                            // 正常加载播放列表
                            loadPlaylist();
                        }
                    }, 100);
                });
                
                // 编辑按钮事件
                card.querySelector('.btn-secondary').addEventListener('click', (e) => {
                    const idx = parseInt(e.currentTarget.getAttribute('data-index'));
                    const pl = storedPlaylists[idx];
                    
                    // 创建编辑表单
                    const editForm = `
                        <div class="form-group">
                            <label for="editPlaylistName">订阅名称</label>
                            <input type="text" id="editPlaylistName" class="form-control" value="${pl.name}">
                        </div>
                        <div class="form-group">
                            <label for="editPlaylistUrl">订阅地址</label>
                            <input type="text" id="editPlaylistUrl" class="form-control" value="${pl.url}">
                        </div>
                    `;
                    
                    showModal(
                        '编辑订阅',
                        editForm,
                        () => {
                            const newName = document.getElementById('editPlaylistName').value.trim();
                            const newUrl = document.getElementById('editPlaylistUrl').value.trim();
                            
                            if (!newName || !newUrl) {
                                showNotification('请填写订阅名称和地址', 'error');
                                return;
                            }
                            
                            // 更新订阅信息
                            storedPlaylists[idx] = { name: newName, url: newUrl };
                            saveStoredPlaylists();
                            renderPlaylistList();
                            showNotification('订阅已更新', 'success');
                        }
                    );
                });
                
                card.querySelector('.btn-danger').addEventListener('click', (e) => {
                    const idx = parseInt(e.currentTarget.getAttribute('data-index'));
                    const pl = storedPlaylists[idx];
                    
                    showModal(
                        '删除订阅',
                        `确定要删除订阅 "${pl.name}" 吗？`,
                        () => {
                            storedPlaylists.splice(idx, 1);
                            saveStoredPlaylists();
                            renderPlaylistList();
                            showNotification('订阅已删除', 'success');
                        }
                    );
                });
            });
        }

        // 保存订阅列表到本地存储
        function saveStoredPlaylists() {
            try {
                localStorage.setItem('m3u8_playlists', JSON.stringify(storedPlaylists));
            } catch (error) {
                console.error('保存订阅列表失败:', error);
            }
        }

        // 从本地存储加载订阅列表
        function loadStoredPlaylists() {
            try {
                const stored = localStorage.getItem('m3u8_playlists');
                if (stored) {
                    storedPlaylists = JSON.parse(stored);
                }
            } catch (error) {
                console.error('加载订阅列表失败:', error);
                storedPlaylists = [];
            }
        }

        // 保存设置
        function saveSettings() {
            const settings = {
                // 强制保存正确的代理路径
                proxyServer: '/api/v1/streamingProxy',
                retryCount: parseInt(document.getElementById('retryCount').value),
                theme: document.getElementById('themeSelect').value,
                autoPlay: document.getElementById('autoPlay').checked,
                rememberLastPlay: document.getElementById('rememberLastPlay').checked
            };
            
            try {
                localStorage.setItem('m3u8_settings', JSON.stringify(settings));
                
                // 更新配置 - 始终使用正确的代理路径
                config.proxyUrl = '/api/v1/streamingProxy';
                config.retryCount = settings.retryCount;
                
                // 确保UI显示正确的值
                document.getElementById('proxyServer').value = '/api/v1/streamingProxy';
                
                showNotification('设置已保存', 'success');
            } catch (error) {
                console.error('保存设置失败:', error);
                showNotification('保存设置失败', 'error');
            }
        }

        // 加载设置
        function loadSettings() {
            try {
                const stored = localStorage.getItem('m3u8_settings');
                if (stored) {
                    const settings = JSON.parse(stored);
                    
                    // 强制使用正确的代理路径
                    document.getElementById('proxyServer').value = '/api/v1/streamingProxy';
                    document.getElementById('retryCount').value = settings.retryCount || 3;
                    document.getElementById('themeSelect').value = settings.theme || 'dark';
                    document.getElementById('autoPlay').checked = settings.autoPlay !== false;
                    document.getElementById('rememberLastPlay').checked = settings.rememberLastPlay || false;
                    
                    // 更新配置 - 始终使用正确的代理路径
                    config.proxyUrl = '/api/v1/streamingProxy';
                    config.retryCount = settings.retryCount || 3;
                } else {
                    // 如果没有存储的设置，确保使用正确的默认值
                    document.getElementById('proxyServer').value = '/api/v1/streamingProxy';
                    config.proxyUrl = '/api/v1/streamingProxy';
                }
            } catch (error) {
                console.error('加载设置失败:', error);
                // 出错时也使用正确的代理路径
                document.getElementById('proxyServer').value = '/api/v1/streamingProxy';
                config.proxyUrl = '/api/v1/streamingProxy';
            }
        }

        // 重置设置
        function resetSettings() {
            showModal(
                '重置设置',
                '确定要将所有设置恢复为默认值吗？',
                () => {
                    localStorage.removeItem('m3u8_settings');
                    loadSettings();
                    showNotification('设置已重置', 'success');
                }
            );
        }

        // 应用初始化已在showPageContent函数中处理，不再需要此处的事件监听器
        // 这样可以确保样式完全加载后再初始化应用，防止渲染闪烁
    </script>
</body>
</html>
