<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3U8 流媒体播放器</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- 性能优化标签 -->
    <meta name="robots" content="index, follow">
    <meta name="description" content="M3U8 流媒体播放器，支持在线播放M3U8格式的视频流">
    <meta name="theme-color" content="#121212">
    <!-- 预加载关键资源 -->
    <link rel="preload" href="favicon.svg" as="image" type="image/svg+xml">
    <!-- 提示浏览器优先执行渲染 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- 预加载关键样式，防止FOUC -->
    <style media="all">
        /* 最小化的关键样式，确保页面立即应用基本外观 */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            visibility: hidden; /* 初始隐藏内容 */
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        /* 样式加载完成后通过JS移除visibility: hidden */
        .app-loaded {
            visibility: visible !important;
            opacity: 1 !important;
        }
        
        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
    </style>
    <!-- 延迟加载非关键脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js" defer crossorigin="anonymous"></script>
    <style media="all">
        /* 全局变量定义 */
        :root {
            --primary-color: #4CAF50;
            --primary-hover: #45a049;
            --secondary-color: #2196F3;
            --accent-color: #FF5722;
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --bg-tertiary: #2c2c2c;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: #333;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 16px rgba(0, 0, 0, 0.4);
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
        }

        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* 主容器 */
        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 导航栏 */
        .navbar {
            background-color: var(--bg-secondary);
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: var(--primary-color);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            padding: 10px 16px;
            color: var(--text-primary);
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-weight: 500;
            transition: var(--transition-fast);
            position: relative;
            overflow: hidden;
        }

        .nav-link:hover {
            background-color: rgba(76, 175, 80, 0.1);
            color: var(--primary-color);
        }

        .nav-link.active {
            background-color: rgba(76, 175, 80, 0.2);
            color: var(--primary-color);
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--primary-color);
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 8px;
        }

        /* 主内容区域 */
        .main-content {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        /* 卡片样式 */
        .card {
            background-color: var(--bg-secondary);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: var(--transition-normal);
        }

        .card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .card-header {
            padding: 16px 20px;
            background-color: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        .card-body {
            padding: 20px;
        }

        /* 表单元素样式 */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            transition: var(--transition-fast);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        /* 按钮样式 */
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-fast);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            min-width: 80px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .btn-secondary {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: rgba(76, 175, 80, 0.1);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .btn-danger {
            background-color: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background-color: #d32f2f;
        }

        .btn-icon {
            padding: 8px;
            min-width: auto;
        }

        .btn-block {
            width: 100%;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* 布局组件 */
        .grid {
            display: grid;
            gap: 24px;
        }

        .grid-cols-1 {
            grid-template-columns: 1fr;
        }

        .grid-cols-2 {
            grid-template-columns: 1fr 1fr;
        }

        .grid-cols-3 {
            grid-template-columns: 1fr 1fr 1fr;
        }

        .flex {
            display: flex;
        }

        .flex-col {
            flex-direction: column;
        }

        .items-center {
            align-items: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .gap-4 {
            gap: 16px;
        }

        .gap-6 {
            gap: 24px;
        }

        /* 播放器组件 */
        .player-section {
            grid-column: 1 / -1;
        }

        .player-container {
            position: relative;
            background-color: #000;
            border-radius: var(--radius-md);
            overflow: hidden;
            aspect-ratio: 16 / 9;
            min-height: 400px;
        }

        .player-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            opacity: 0;
            transition: var(--transition-normal);
        }

        .player-container:hover .player-overlay {
            opacity: 1;
        }

        .player-info {
            margin-bottom: 16px;
        }

        .channel-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            margin-bottom: 4px;
        }

        .channel-subtitle {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .player-controls {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        /* 内容区域 */
        .content-area {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 24px;
        }

        /* 侧边栏 */
        .sidebar {
            background-color: var(--bg-secondary);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        .sidebar-body {
            padding: 16px;
        }

        /* 频道列表 */
        .channel-search {
            margin-bottom: 16px;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            min-height: 0; /* 防止flex子元素溢出 */
        }

        .group-section {
            margin-bottom: 16px;
        }

        .group-header {
            padding: 10px 12px;
            background-color: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            transition: var(--transition-fast);
        }

        .group-header:hover {
            background-color: rgba(76, 175, 80, 0.1);
        }

        .group-toggle {
            transition: transform 0.3s ease;
        }

        .group-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .group-content {
            margin-top: 8px;
            max-height: 300px;
            overflow-y: auto;
            transition: max-height 0.3s ease;
        }

        .group-content.collapsed {
            max-height: 0;
            overflow: hidden;
            margin-top: 0;
        }

        .channel-item {
            padding: 10px 12px 10px 24px;
            cursor: pointer;
            border-radius: var(--radius-sm);
            margin-bottom: 4px;
            transition: var(--transition-fast);
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .channel-item:hover {
            background-color: rgba(76, 175, 80, 0.1);
            border-left-color: var(--primary-color);
        }

        .channel-item.active {
            background-color: rgba(76, 175, 80, 0.2);
            border-left-color: var(--primary-color);
            font-weight: 500;
        }

        .channel-icon {
            width: 48px;
            height: 48px;
            background-color: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* 分组标签 */
        .group-tags {
            margin-bottom: 16px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            padding: 6px 12px;
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
            border-radius: 16px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition-fast);
            border: 1px solid transparent;
        }

        .tag:hover {
            background-color: rgba(33, 150, 243, 0.1);
            color: var(--secondary-color);
        }

        .tag.active {
            background-color: var(--secondary-color);
            color: white;
        }

        /* 订阅管理区域 */
        .playlist-manager {
            background-color: var(--bg-secondary);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            height: 424px;
            display: flex;
            flex-direction: column;
        }

        .playlist-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            margin-top: 8px;
            /* 确保滚动条始终可见 */
            min-height: 0; /* 重要：防止flex子元素溢出 */
        }

        .playlist-card {
            display: flex;
            align-items: center;
            padding: 12px;
            background-color: var(--bg-primary);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            transition: background-color 0.2s;
        }

        .playlist-card:hover {
            background-color: var(--hover-bg);
        }

        .playlist-info {
            flex: 1;
            min-width: 0;
            margin-right: 8px;
        }

        .playlist-name {
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-url {
            font-size: 0.85em;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .playlist-card {
            background-color: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            padding: 16px;
            transition: var(--transition-fast);
            border: 1px solid var(--border-color);
        }

        .playlist-card:hover {
            border-color: var(--primary-color);
            box-shadow: 0 4px 8px rgba(76, 175, 80, 0.1);
        }

        .playlist-name {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .playlist-url {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            word-break: break-all;
        }

        .playlist-actions {
            display: flex;
            gap: 8px;
        }

        /* 通知系统 */
        .notification {
            position: fixed;
            top: 80px;
            right: 24px;
            max-width: 350px;
            padding: 16px 20px;
            background-color: var(--primary-color);
            color: white;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            z-index: 1001;
            transform: translateX(100%);
            opacity: 0;
            transition: var(--transition-normal);
        }

        .notification.show {
            transform: translateX(0);
            opacity: 1;
        }

        .notification.error {
            background-color: #f44336;
        }

        .notification.info {
            background-color: var(--secondary-color);
        }

        /* 加载状态 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .loader {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        /* 模态框 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1002;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-normal);
        }

        .modal.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--bg-secondary);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            transform: scale(0.9);
            transition: var(--transition-normal);
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .close-button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px;
            transition: var(--transition-fast);
        }

        .close-button:hover {
            color: var(--text-primary);
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        /* 动画效果 */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .slide-up {
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .scale-in {
            animation: scaleIn 0.3s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.95);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .content-area {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
                margin-bottom: 24px;
            }

            .grid-cols-3 {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* IPTV布局特定样式 */
        .grid-cols-4 {
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 16px;
        }

        .sidebar {
            background-color: var(--bg-secondary);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .sidebar-header {
            padding: 16px;
            background-color: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-body {
            padding: 16px;
        }

        .player-section {
            width: 100%;
        }

        .mb-4 {
            margin-bottom: 16px;
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            /* 在较大的平板设备上，调整布局 */
            .grid-cols-4 {
                grid-template-columns: 1fr 3fr;
            }
            
            .grid-cols-3 {
                grid-template-columns: 1fr 1fr;
            }
            
            /* 让第三个卡片跨两列 */
            .grid-cols-3 > .card:last-child {
                grid-column: span 2;
            }
        }

        @media (max-width: 1024px) {
            .grid-cols-4 {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                max-height: 300px;
                margin-bottom: 1rem;
            }
            
            .player-section {
                min-height: 300px;
            }
            
            .grid-cols-3 {
                grid-template-columns: 1fr;
            }
            
            .grid-cols-3 > .card {
                grid-column: span 1;
            }
        }

        @media (max-width: 768px) {
            .navbar-content {
                padding: 0 16px;
            }

            .nav-links {
                position: fixed;
                top: 64px;
                left: 0;
                right: 0;
                background-color: var(--bg-secondary);
                flex-direction: column;
                padding: 16px;
                gap: 8px;
                box-shadow: var(--shadow-md);
                transform: translateY(-150%);
                transition: var(--transition-normal);
                z-index: 999;
            }

            .nav-links.show {
                transform: translateY(0);
            }

            .mobile-menu-btn {
                display: block;
            }

            .main-content {
                padding: 16px;
                gap: 16px;
            }

            .grid-cols-4,
            .grid-cols-2 {
                grid-template-columns: 1fr;
            }
            
            /* 确保三列布局为单列 */
            .grid-cols-3 {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                max-height: 200px;

    <script>
        // 添加全局错误处理
        window.onerror = function(message, source, lineno, colno, error) {
            // 专门处理ct.js的document.body为null错误
            if (message.includes('document.body is null') && source && source.includes('ct.js')) {
                console.warn('检测到外部脚本ct.js错误，正在安全处理...');
                // 尝试延迟修复document.body引用问题
                setTimeout(function() {
                    if (typeof document !== 'undefined' && document.body) {
                        console.log('document.body现已可用');
                    }
                }, 100);
                // 防止错误冒泡并阻止默认处理
                return true;
            }
            // 其他错误正常处理
            return false;
        };
        
        // 添加脚本错误事件监听
        window.addEventListener('error', function(event) {
            if (event.target && event.target.tagName === 'SCRIPT' && 
                event.target.src && event.target.src.includes('ct.js')) {
                console.warn('捕获到外部脚本ct.js加载错误:', event.error);
                event.preventDefault();
            }
        }, true);
        
        // 确保即使有外部脚本错误，应用也能启动
        if (typeof window !== 'undefined' && typeof document !== 'undefined') {
            // 页面加载完成后显示内容，防止FOUC
            function showPageContent() {
                // 确保样式表已加载完成
                const sheets = document.styleSheets;
                let allSheetsLoaded = true;
                
                // 检查内联样式是否已加载（对于内联样式，我们假设它们已经可用）
                // 对于这个应用，主要是内联样式，所以直接继续
                
                // 添加app-loaded类显示页面
                document.documentElement.classList.add('app-loaded');
                document.body.classList.add('app-loaded');
                console.log('页面内容已显示');
                
                // 在内容显示后再初始化应用
                if (typeof initApp === 'function') {
                    console.log('开始初始化应用...');
                    initApp();
                }
            }
            
            // 检查DOM是否已加载
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function() {
                    console.log('DOM内容已加载');
                    // 稍微延迟一点以确保样式应用
                    setTimeout(showPageContent, 100);
                });
            } else {
                console.log('DOM已准备就绪');
                // 如果DOM已经准备好，立即显示内容
                showPageContent();
            }
        }
        
        // 移除原有的DOMContentLoaded事件监听器，避免重复初始化
        // 将在showPageContent中手动调用initApp
        
        // 配置和状态变量
        const config = {
            proxyUrl: '/api/v1/streamingProxy', // 使用正确的代理路径
            retryCount: 3,
            maxRetryDelay: 5000,
            defaultTimeout: 10000
        };

        // 全局状态变量
        let currentPlaylist = null;
        let currentChannel = null;
        let storedPlaylists = [];
        let allChannels = [];
        let hls = null;
        let video = null;
        let activeSection = 'home';
        let elements = {};

        // 初始化应用
        function initApp() {
            // 初始化DOM元素引用
            video = document.getElementById('videoPlayer');
            
            // DOM 元素
            elements = {
                navLinks: document.getElementById('navLinks'),
                mobileMenuBtn: document.getElementById('mobileMenuBtn'),
                sections: document.querySelectorAll('.section'),
                channelList: document.getElementById('channelList'),
                groupTags: document.getElementById('groupTags'),
                channelSearch: document.getElementById('channelSearch'),
                playlistUrl: document.getElementById('playlistUrl'),
                playlistName: document.getElementById('playlistName'),
                loadPlaylistBtn: document.getElementById('loadPlaylistBtn'),
                managePlaylistsBtn: document.getElementById('managePlaylistsBtn'),
                currentChannelTitle: document.getElementById('currentChannelTitle'),
                currentChannelGroup: document.getElementById('currentChannelGroup'),
                playerInfo: document.getElementById('playerInfo'),
                notification: document.getElementById('notification'),
                modal: document.getElementById('modal'),
                modalTitle: document.getElementById('modalTitle'),
                modalBody: document.getElementById('modalBody'),
                closeModal: document.getElementById('closeModal'),
                modalCancel: document.getElementById('modalCancel'),
                modalConfirm: document.getElementById('modalConfirm'),
                playlistList: document.getElementById('playlistList'),
                // 移除了不再使用的元素引用：newPlaylistName, newPlaylistUrl, addPlaylistBtn
                saveSettingsBtn: document.getElementById('saveSettingsBtn'),
                resetSettingsBtn: document.getElementById('resetSettingsBtn'),
                fullscreenBtn: document.getElementById('fullscreenBtn')
            };
            
            // 加载存储的订阅列表
            loadStoredPlaylists();
            
            // 加载设置
            loadSettings();
            
            // 渲染订阅列表
            renderPlaylistList();
            
            // 设置事件监听器
            setupEventListeners();
            
            // 从URL参数加载订阅（如果有）
            const urlParams = new URLSearchParams(window.location.search);
            const playlistUrlParam = urlParams.get('url');
            if (playlistUrlParam) {
                elements.playlistUrl.value = playlistUrlParam;
                if (!elements.playlistName.value) {
                    elements.playlistName.value = '从URL加载';
                }
                loadPlaylist();
            }
        }

        // 播放/暂停切换功能
        function togglePlayPause() {
            if (video.paused || video.ended) {
                video.play().then(() => {
                    // 更新播放按钮图标
                    const playPauseBtn = document.getElementById('playPauseBtn');
                    if (playPauseBtn) {
                        playPauseBtn.innerHTML = '⏸️';
                    }
                }).catch(error => {
                    showNotification('播放失败: ' + error.message, 'error');
                });
            } else {
                video.pause();
                // 更新暂停按钮图标
                const playPauseBtn = document.getElementById('playPauseBtn');
                if (playPauseBtn) {
                    playPauseBtn.innerHTML = '▶️';
                }
            }
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 导航栏切换
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const section = link.getAttribute('data-section');
                    switchSection(section);
                });
            });

            // 移动端菜单
            elements.mobileMenuBtn.addEventListener('click', () => {
                elements.navLinks.classList.toggle('show');
            });

            // 加载订阅按钮
            elements.loadPlaylistBtn.addEventListener('click', loadPlaylist);

            // 管理订阅按钮 - 如果存在
            if (elements.managePlaylistsBtn) {
                elements.managePlaylistsBtn.addEventListener('click', () => {
                    switchSection('home');
                });
            }

            // 频道搜索
            elements.channelSearch.addEventListener('input', filterChannels);

            // 模态框事件
            elements.closeModal.addEventListener('click', closeModal);
            elements.modalCancel.addEventListener('click', closeModal);
            elements.modal.addEventListener('click', (e) => {
                if (e.target === elements.modal) {
                    closeModal();
                }
            });

            // 移除了重复的添加订阅按钮，添加订阅功能已整合到加载订阅按钮中

            // 保存设置按钮
            elements.saveSettingsBtn.addEventListener('click', saveSettings);
            elements.resetSettingsBtn.addEventListener('click', resetSettings);

            // 视频播放器事件
            video.addEventListener('error', handleVideoError);
            video.addEventListener('play', () => {
                showNotification('开始播放', 'success');
                // 更新播放按钮图标为暂停
                const playPauseBtn = document.getElementById('playPauseBtn');
                if (playPauseBtn) {
                    playPauseBtn.innerHTML = '⏸️';
                }
            });
            
            video.addEventListener('pause', () => {
                // 更新播放按钮图标为播放
                const playPauseBtn = document.getElementById('playPauseBtn');
                if (playPauseBtn) {
                    playPauseBtn.innerHTML = '▶️';
                }
            });
            
            // 播放/暂停按钮事件
            const playPauseBtn = document.getElementById('playPauseBtn');
            if (playPauseBtn) {
                playPauseBtn.addEventListener('click', togglePlayPause);
            }
            
            // 视频元素点击事件，支持点击视频区域播放/暂停
            video.addEventListener('click', togglePlayPause);
            
            // 刷新按钮事件
            document.getElementById('refreshBtn').addEventListener('click', () => {
                if (currentChannel) {
                    playChannel(currentChannel);
                    showNotification('正在刷新频道...', 'info');
                }
            });
            
            // 保存按钮事件
            document.getElementById('saveBtn').addEventListener('click', () => {
                if (currentChannel) {
                    // 创建一个临时的播放列表对象只包含当前频道
                    // 添加isSingleChannel标记，以便后续正确处理
                    const tempPlaylist = {
                        name: currentChannel.name || '未命名频道',
                        url: currentChannel.url,
                        channels: [currentChannel],
                        isSingleChannel: true
                    };
                    
                    // 添加到存储的播放列表
                    storedPlaylists.push(tempPlaylist);
                    saveStoredPlaylists();
                    renderPlaylistList();
                    showNotification(`已保存频道 "${currentChannel.name || '未命名频道'}"`, 'success');
                }
            });
            
            // 全屏按钮点击事件
            elements.fullscreenBtn.addEventListener('click', toggleFullscreen);
            
            // 全屏切换函数
            function toggleFullscreen() {
                const playerWrapper = document.querySelector('.player-wrapper');
                if (!document.fullscreenElement) {
                    // 进入全屏
                    if (playerWrapper.requestFullscreen) {
                        playerWrapper.requestFullscreen();
                    } else if (playerWrapper.webkitRequestFullscreen) {
                        playerWrapper.webkitRequestFullscreen();
                    } else if (playerWrapper.msRequestFullscreen) {
                        playerWrapper.msRequestFullscreen();
                    }
                } else {
                    // 退出全屏
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    }
                }
            }
            
            // 播放器按钮事件
            
            // 音量按钮和滑块事件
            const volumeBtn = document.getElementById('volumeBtn');
            const volumeSlider = document.getElementById('volumeSlider');
            let isMuted = false;
            let previousVolume = 1;
            
            // 音量按钮点击实现静音切换
            volumeBtn.addEventListener('click', () => {
                toggleMute();
            });
            
            // 静音切换功能
            function toggleMute() {
                if (isMuted) {
                    // 取消静音，恢复之前的音量
                    video.volume = previousVolume;
                    isMuted = false;
                } else {
                    // 静音，保存当前音量
                    previousVolume = video.volume;
                    video.volume = 0;
                    isMuted = true;
                }
                updateVolumeIcon();
                volumeSlider.value = video.volume;
            }
            
            // 音量滑块控制
            volumeSlider.addEventListener('input', () => {
                video.volume = volumeSlider.value;
                // 如果通过滑块调节音量，更新静音状态
                isMuted = video.volume === 0;
                // 更新音量图标
                updateVolumeIcon();
            });
            
            // 音量变化时更新图标
            function updateVolumeIcon() {
                if (video.volume === 0) {
                    volumeBtn.textContent = '🔇';
                } else if (video.volume < 0.5) {
                    volumeBtn.textContent = '🔈';
                } else {
                    volumeBtn.textContent = '🔊';
                }
            }
            
            // 初始化音量图标
            updateVolumeIcon();
            
            // 移除了隐藏音量滑块的逻辑，滑块现在始终可见
            
            // 播放进度控制相关
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressHandle = document.getElementById('progressHandle');
            
            // 时间格式化函数 (秒 -> mm:ss)
            function formatTime(seconds) {
                if (isNaN(seconds)) return '00:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            
            // 更新播放进度
            function updateProgress() {
                if (video.duration) {
                    const percent = (video.currentTime / video.duration) * 100;
                    progressBar.style.width = percent + '%';
                    progressHandle.style.left = percent + '%';
                    
                    // 更新时间显示
                    document.getElementById('currentTime').textContent = formatTime(video.currentTime);
                    document.getElementById('totalTime').textContent = formatTime(video.duration);
                }
            }
            
            // 视频时间更新事件
            video.addEventListener('timeupdate', updateProgress);
            
            // 进度条点击跳转
            progressContainer.addEventListener('click', (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                video.currentTime = pos * video.duration;
            });
            
            // 拖动进度条
            let isDragging = false;
            
            progressHandle.addEventListener('mousedown', (e) => {
                isDragging = true;
                e.preventDefault();
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                const rect = progressContainer.getBoundingClientRect();
                let pos = (e.clientX - rect.left) / rect.width;
                // 限制在0-1范围内
                pos = Math.max(0, Math.min(1, pos));
                
                const percent = pos * 100;
                progressBar.style.width = percent + '%';
                progressHandle.style.left = percent + '%';
            });
            
            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    // 设置视频位置
                    const percent = parseFloat(progressBar.style.width) / 100;
                    video.currentTime = percent * video.duration;
                }
            });
            
            // 视频加载元数据时更新进度条
            video.addEventListener('loadedmetadata', updateProgress);
            // 视频开始播放时更新进度条
            video.addEventListener('play', updateProgress);
            // 视频结束时重置进度条
            video.addEventListener('ended', updateProgress);
        }

        // 加载订阅列表
        function loadPlaylist() {
            const url = elements.playlistUrl.value.trim();
            const name = elements.playlistName.value.trim() || '未命名订阅';
            
            if (!url) {
                showNotification('请输入订阅地址', 'error');
                return;
            }
            
            // 显示加载状态
            showLoading(true);
            
            // 重置当前状态
            allChannels = [];
            currentPlaylist = null;
            
            // 加载和解析M3U内容
            fetchM3UContent(url, name)
                .then(playlist => {
                    currentPlaylist = playlist;
                    allChannels = playlist.channels;
                    
                    // 渲染频道列表
                    renderChannelList();
                    renderGroupTags();
                    
                    showNotification(`成功加载 ${playlist.channels.length} 个频道`, 'success');
                    
                    // 如果有频道，自动选择第一个
                    if (playlist.channels.length > 0) {
                        selectChannel(playlist.channels[0]);
                    }
                    
                    // 加载成功后保存订阅
                    addPlaylistToList(name, url);
                    showNotification('订阅已保存到管理列表', 'success');
                })
                .catch(error => {
                    console.error('加载订阅失败:', error);
                    
                    // 对于403错误的特殊处理
                    if (error.message.includes('403')) {
                        showNotification(`加载失败: ${error.message}`, 'error');
                        
                        // 询问用户是否仍要保存此订阅
                        if (confirm('该订阅源返回403错误（访问被拒绝），但您仍可以将其保存到订阅列表中。是否保存？')) {
                            addPlaylistToList(name, url);
                            showNotification('订阅已保存到管理列表，但当前无法访问', 'warning');
                        }
                    } else {
                        showNotification(`加载失败: ${error.message}`, 'error');
                        
                        // 尝试使用备用代理（仅对非403错误）
                        if (config.proxyUrl === '/api/v1/streamingProxy') {
                            showNotification('尝试使用备用代理...', 'info');
                            const originalProxy = config.proxyUrl;
                            config.proxyUrl = '/api/v1/streamingProxy';
                            
                            fetchM3UContent(url, name)
                                .then(playlist => {
                                    currentPlaylist = playlist;
                                    allChannels = playlist.channels;
                                    renderChannelList();
                                    renderGroupTags();
                                    showNotification(`使用备用代理成功加载 ${playlist.channels.length} 个频道`, 'success');
                                    
                                    if (playlist.channels.length > 0) {
                                        selectChannel(playlist.channels[0]);
                                    }
                                    
                                    // 加载成功后保存订阅
                                    addPlaylistToList(name, url);
                                })
                                .catch(err => {
                                    config.proxyUrl = originalProxy; // 恢复原代理
                                    showNotification(`备用代理也失败: ${err.message}`, 'error');
                                })
                                .finally(() => showLoading(false));
                            return; // 避免执行外部的finally
                        }
                    }
                })
                .finally(() => {
                    showLoading(false);
                });
        }

        // 获取M3U内容（带重试机制）
        async function fetchM3UContent(url, name, retryCount = 0) {
            try {
                let fetchUrl = url;
                
                // 如果配置了代理，使用代理
                if (config.proxyUrl && config.proxyUrl.trim()) {
                    fetchUrl = `${config.proxyUrl}?url=${encodeURIComponent(url)}`;
                }
                
                const response = await fetch(fetchUrl, {
                    headers: {
                        'Accept': 'text/plain, application/x-mpegURL'
                    },
                    timeout: config.defaultTimeout
                });
                
                // 对403错误特殊处理，不进行重试
                if (response.status === 403) {
                    throw new Error(`HTTP 403 错误：访问被拒绝，请检查订阅源地址是否有效`);
                }
                
                if (!response.ok) {
                    throw new Error(`HTTP错误 ${response.status}`);
                }
                
                const text = await response.text();
                return parseM3U(text, name, url);
            } catch (error) {
                // 对于403错误或其他错误，仅在满足重试条件时重试
                if (retryCount < config.retryCount && !error.message.includes('403')) {
                    const delay = Math.min(1000 * Math.pow(2, retryCount), config.maxRetryDelay);
                    showNotification(`重试中... (${retryCount + 1}/${config.retryCount})`, 'info');
                    
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchM3UContent(url, name, retryCount + 1);
                }
                
                throw error;
            }
        }

        // 解析M3U内容
        function parseM3U(content, name, url) {
            const lines = content.split('\n');
            const channels = [];
            let currentChannel = null;
            let currentGroup = '未分组';
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                if (line.startsWith('#EXTINF:')) {
                    // 提取频道信息
                    const match = line.match(/#EXTINF:-?\d+\s*(.*?),\s*(.*)/);
                    if (match) {
                        const info = match[1];
                        const channelName = match[2];
                        
                        // 提取分组信息
                        const groupMatch = info.match(/group-title="([^"]+)"/);
                        if (groupMatch) {
                            currentGroup = groupMatch[1];
                        }
                        
                        // 提取tvg-id
                        const tvgIdMatch = info.match(/tvg-id="([^"]+)"/);
                        const tvgId = tvgIdMatch ? tvgIdMatch[1] : null;
                        
                        // 提取logo
                        const logoMatch = info.match(/tvg-logo="([^"]+)"/);
                        const logo = logoMatch ? logoMatch[1] : null;
                        
                        currentChannel = {
                            id: channels.length + 1,
                            name: channelName,
                            group: currentGroup,
                            tvgId: tvgId,
                            logo: logo,
                            url: null
                        };
                    }
                } else if (line && !line.startsWith('#') && currentChannel) {
                    // 频道URL
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = null;
                }
            }
            
            return {
                name: name,
                url: url,
                channels: channels,
                groups: [...new Set(channels.map(c => c.group))].sort()
            };
        }

        // 渲染频道列表
        function renderChannelList(filterGroup = null, searchTerm = '') {
            elements.channelList.innerHTML = '';
            
            if (allChannels.length === 0) {
                elements.channelList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📺</div>
                        <div class="empty-title">暂无频道</div>
                        <p>请先添加M3U订阅源</p>
                    </div>
                `;
                return;
            }
            
            // 过滤频道
            let filteredChannels = [...allChannels];
            
            if (filterGroup) {
                filteredChannels = filteredChannels.filter(channel => channel.group === filterGroup);
            }
            
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filteredChannels = filteredChannels.filter(channel => 
                    channel.name.toLowerCase().includes(term) || 
                    channel.group.toLowerCase().includes(term)
                );
            }
            
            if (filteredChannels.length === 0) {
                elements.channelList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-title">没有找到匹配的频道</div>
                        <p>请尝试其他搜索关键词</p>
                    </div>
                `;
                return;
            }
            
            // 按分组组织频道
            const channelsByGroup = {};
            filteredChannels.forEach(channel => {
                if (!channelsByGroup[channel.group]) {
                    channelsByGroup[channel.group] = [];
                }
                channelsByGroup[channel.group].push(channel);
            });
            
            // 渲染分组和频道
            Object.keys(channelsByGroup).sort().forEach(groupName => {
                const groupChannels = channelsByGroup[groupName];
                
                const groupElement = document.createElement('div');
                groupElement.className = 'group-section';
                groupElement.innerHTML = `
                    <div class="group-header" data-group="${groupName}">
                        <span>${groupName} (${groupChannels.length})</span>
                        <span class="group-toggle">▼</span>
                    </div>
                    <div class="group-content">
                        ${groupChannels.map(channel => `
                            <div class="channel-item" data-id="${channel.id}">
                                <div class="channel-icon">📺</div>
                                <span>${channel.name}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                
                elements.channelList.appendChild(groupElement);
                
                // 添加分组展开/折叠事件
                const header = groupElement.querySelector('.group-header');
                const content = groupElement.querySelector('.group-content');
                const toggle = groupElement.querySelector('.group-toggle');
                
                header.addEventListener('click', () => {
                    content.classList.toggle('collapsed');
                    toggle.classList.toggle('collapsed');
                });
                
                // 添加频道点击事件
                groupElement.querySelectorAll('.channel-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const channelId = parseInt(item.getAttribute('data-id'));
                        const channel = groupChannels.find(c => c.id === channelId);
                        if (channel) {
                            selectChannel(channel);
                        }
                    });
                });
            });
        }

        // 播放频道
        function playChannel(channel) {
            console.log(`开始播放频道: ${channel.name}`);
            // 停止当前播放
            if (hls) {
                try {
                    hls.destroy();
                } catch (e) {
                    console.warn('销毁旧的HLS实例时出错:', e);
                }
                hls = null;
            }
            
            // 确保视频元素完全重置
            try {
                video.pause();
                video.src = '';
                video.load(); // 强制重新加载以清除任何旧资源
            } catch (e) {
                console.warn('重置视频元素时出错:', e);
            }
            
            // 构建播放URL（使用代理）
            let playUrl = channel.url;
            if (config.proxyUrl && config.proxyUrl.trim()) {
                playUrl = `${config.proxyUrl}?url=${encodeURIComponent(channel.url)}`;
            }
            
            // 检测流类型
            const isLiveStream = channel.url.includes('live') || channel.url.includes('stream') || channel.isLive;
            const isAACStream = channel.url.includes('.aac') || channel.url.includes('audio');
            
            // 预先设置视频元素的自动播放属性，提高自动播放成功率
            video.autoplay = document.getElementById('autoPlay').checked;
            // 默认不静音，移除自动播放时的静音限制
            video.muted = false;
            // 尝试不使用静音模式，让电视直播和电台一样自动播放时有声音
            // 添加错误处理，当浏览器阻止播放时尝试恢复
            const handlePlayError = (e) => {
                console.warn('播放失败，可能是浏览器自动播放策略限制:', e);
                // 如果播放被阻止且不是静音状态，尝试静音后播放
                if (!video.muted) {
                    console.log('尝试静音模式播放以绕过浏览器限制');
                    video.muted = true;
                    const playPromise = video.play();
                    if (playPromise) {
                        playPromise.catch(err => console.warn('即使静音仍无法自动播放:', err));
                    }
                }
                // 移除事件监听器避免重复触发
                video.removeEventListener('error', handlePlayError);
                video.removeEventListener('playerror', handlePlayError);
            };
            
            // 添加错误监听器
            video.addEventListener('error', handlePlayError);
            video.addEventListener('playerror', handlePlayError);
            
            // 确保在用户交互后可以取消静音
            const ensureAudioOnInteraction = () => {
                if (video.muted) {
                    console.log('用户交互后取消静音');
                    video.muted = false;
                }
            };
            
            // 添加一次性的用户交互监听器
            document.addEventListener('click', ensureAudioOnInteraction, { once: true });
            document.addEventListener('keydown', ensureAudioOnInteraction, { once: true });
            
            
            console.log(`初始化播放，频道: ${channel.name}, URL: ${playUrl}, 直播流: ${isLiveStream}, AAC流: ${isAACStream}`);
            
            // 根据流类型动态调整配置
            const streamConfig = {
                live: {
                    maxBufferLength: 3,
                    maxMaxBufferLength: 6,
                    backBufferLength: 30,
                    maxRetries: 5,
                    retryDelay: 1000
                },
                audio: {
                    maxBufferLength: 5,
                    maxMaxBufferLength: 10,
                    backBufferLength: 60,
                    maxRetries: 3,
                    retryDelay: 800
                },
                default: {
                    maxBufferLength: 10,
                    maxMaxBufferLength: 30,
                    backBufferLength: 90,
                    maxRetries: 3,
                    retryDelay: 1000
                }
            };
            
            const currentConfig = isLiveStream ? streamConfig.live : (isAACStream ? streamConfig.audio : streamConfig.default);
            
            // 检查是否支持HLS
            if (Hls.isSupported()) {
                // 使用增强的HLS配置，提高兼容性并解决缓冲区和网络错误
                hls = new Hls({
                    // 基础配置
                    enableWorker: false, // 禁用worker提高兼容性
                    startPosition: -1, // 始终从最新位置开始
                    // 缓冲区配置
                    maxBufferLength: currentConfig.maxBufferLength,
                    maxMaxBufferLength: currentConfig.maxMaxBufferLength,

                // 网络状态变化监听

                function ensureAudioChannelInitialized() {

                    // 方法2: 提前强制启用所有音频轨道（如果有）

                    ensureAudioChannelInitialized();

                        setTimeout(() => {

                                    if (error.name === 'NotAllowedError') {
                                        showNotification(isXimalaya ? '喜马拉雅频道需要点击播放' : '自动播放被浏览器阻止，请点击播放按钮', 'info');
                                    } else if (error.name === 'AbortError' || error.message.includes('aborted by the user agent')) {

                                        try {
                                            hls.destroy();

                // 关键错误处理

                                    // 尝试降级到原生播放
                                    if (video.canPlayType('application/vnd.apple.mpegurl')) {

                                        hls.destroy();
                                        video.src = playUrl;

                                        hls.destroy();

                            case Hls.ErrorTypes.MEDIA_ERROR:

                                    showNotification('媒体错误，尝试恢复...', 'warning');

                                // 添加额外的检查确保hls实例仍然有效

                                    hls.stopLoad();

                                        try {
                                            hls.recoverMediaError();

                                            if (video.audioTracks && video.audioTracks.length > 0) {
                                                for (let i = 0; i < video.audioTracks.length; i++) {
                                                    video.audioTracks[i].enabled = true;
                                                }

                                        } catch (recoverError) {
                                            console.error('恢复媒体错误失败:', recoverError);

                                            if (errorCount < currentConfig.maxRetries) {
                                                errorCount++;
                                                setTimeout(() => {
                                                    hls.loadSource(playUrl);
                                                    hls.attachMedia(video);
                                                }, currentConfig.retryDelay * errorCount);
                                            }
                                        }
                                    }, 200);
                                }
                            } catch (e) {
                                console.error('执行恢复时出错:', e);
                            }
                        }, currentConfig.retryDelay);
                                }
                                break;
                                
                            case Hls.ErrorTypes.MANIFEST_ERROR:

                            if (data.details === 'bufferSeekOverHole') {

                                // 针对缓冲区空洞的特定恢复策略
                                if (video.currentTime < video.duration || isNaN(video.duration)) {

                                    const newTime = Math.max(0, video.currentTime - 0.5);
                                    console.log(`尝试从${video.currentTime}跳转到${newTime}修复缓冲区空洞`);
                                    video.currentTime = newTime;
                                    // 清理部分缓冲区并重新加载

                hls.on(Hls.Events.FRAG_LOADED, (event, data) => {

                        }

                function checkAudioStatus() {

                    // 方法1: 检查audioTracks

                        for (let i = 0; i < video.audioTracks.length; i++) {
                            video.audioTracks[i].enabled = true;
                        }
                        return true;
                    }
                    
                    // 方法2: 检查是否有有效时长（不是NaN或0）
                    if (video.readyState >= 2 && !isNaN(video.duration) && video.duration > 0) {

                    }

                    if (video.currentSrc && (video.currentSrc.includes('audio') || video.currentSrc.includes('.aac') || 
                        video.canPlayType('audio/mpeg') !== '' || video.canPlayType('audio/aac') !== '')) {
                        console.log('视频URL暗示包含音频内容');
                        return true;
                    }
                    
                    // 方法4: 检查视频是否正在播放（有播放事件）
                    if (video.currentTime > 0 && !video.paused) {
                        return true;
                    }
                    
                    return false;

                // 优化的音频恢复策略
                function attemptAudioRecovery() {
                    if (audioCheckCount >= maxAudioChecks || audioRestored) return;
                    
                    audioCheckCount++;
                    console.log(`尝试音频恢复 (${audioCheckCount}/${maxAudioChecks})`);
